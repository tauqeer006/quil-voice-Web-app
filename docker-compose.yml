version: "3.9"
services:
  backend:
    build: ./backend
    container_name: platform_backend
    env_file: ./backend/.env
    environment:
      - AI_SERVICE_BASE_URL=http://host.docker.internal:8001
    ports:
      - "8000:8000"
    networks:
      - platform_net

  frontend:
    build: ./frontend
    container_name: platform_frontend
    ports:
      - "5173:80"
    networks:
      - platform_net

networks:
  platform_net:
